[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "training-contract-hub"
version = "1.0.0"
description = "Strict-order event contract negotiation, revision, and correction middleware"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
contract-hub = "contract_hub.cli:main"

[tool.setuptools]
packages = ["contract_hub"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
